name: errdain

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8010
    container_name: errdain-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: errdain-backend
    command: ["sh", "-c", "alembic -c backend/alembic.ini upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://errdain:errdain123@postgres:5432/errdain
      OUTPUT_DIR: /var/lib/errdain/output
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8010:8000"
    volumes:
      - backend_output:/var/lib/errdain/output
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: errdain-postgres
    environment:
      POSTGRES_DB: errdain
      POSTGRES_USER: errdain
      POSTGRES_PASSWORD: errdain123
    ports:
      - "55434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U errdain -d errdain"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: errdain-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@errdain.example
      PGADMIN_DEFAULT_PASSWORD: errdain123
    ports:
      - "5051:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/misc/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  backend_output:
  postgres_data:
  pgadmin_data:
